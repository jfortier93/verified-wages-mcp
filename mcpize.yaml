# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "Verified Wages"
slug: "verified-wages"

runtime: container
entry: "server.py"

build:
  install: "pip install -r requirements.txt"
  dockerfile: "Dockerfile"

start:
  type: stdio
  command: "python"
  args:
    - "server.py"

bridge:
  mode: stdio
